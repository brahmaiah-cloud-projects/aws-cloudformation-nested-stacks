AWSTemplateFormatVersion: 2010-09-09

Parameters:

  VpcId:
    Type: String


Resources:

  MyALBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow HTTP From the Interne
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol : tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0

  MyEC2SecurityGroup:

    Type: AWS::EC2::SecurityGroup
    Properties:
   
     GroupDescription: Allow HTTP and SSH
     VpcId: !Ref VpcId

     SecurityGroupIngress:
       - IpProtocol: tcp
         FromPort: 80
         ToPort: 80
         SourceSecurityGroupId:
           !Ref MyALBSecurityGroup

       - IpProtocol: tcp
         FromPort: 22
         ToPort: 22
         CidrIp: 0.0.0.0/0


Outputs:

  ALBSecurityGroupId:
    Value: !Ref MyALBSecurityGroup

  MyEC2SecurityGroupId:
    Value: !Ref MyEC2SecurityGroup
